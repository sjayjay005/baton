<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baton recorder</title>
<link rel="stylesheet" href="recorder.css">
</head>
<body>
  <div class="brand"><img src="/icons/icon48.png" width="24" height="24" alt=""><span>baton</span><span class="tag">recorder</span></div>

  <section id="setup">
    <p>Record the tab you're testing. When Chrome asks, pick the <strong>Chrome Tab</strong> you're testing.</p>
    <label class="check"><input type="checkbox" id="mic"> 🎙️ Narrate with my microphone</label>
    <label class="check"><input type="checkbox" id="tabAudio" checked> 🔊 Include tab audio</label>
    <button type="button" id="start" class="btn primary">⏺ Start recording</button>
    <p class="muted small">Up to 10 minutes. Stop here, from Baton, or with Chrome's “Stop sharing” bar.</p>
  </section>

  <section id="live" hidden>
    <div class="rec"><span class="dot"></span><span id="timer">00:00</span></div>
    <p class="muted small" id="what"></p>
    <button type="button" id="stop" class="btn danger">■ Stop and save</button>
  </section>

  <section id="done" hidden>
    <p class="big">🎬 Saved!</p>
    <p id="saved" class="muted"></p>
    <p class="muted small">It's in DevTools → Baton → Bug report. This window closes on its own.</p>
  </section>

  <p id="error" class="error" role="alert"></p>
  <script type="module" src="recorder.js"></script>
</body>
</html>
